<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Selling Page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
</head>

<body>
    <header>
        <div class="navbar">
            <div class="logo">
                <img src="CompanyLogo.png" alt="Watch Logo" width="100">
            </div>
            <div class="menu">
                <ul>
                    <li><a href="#" target="_blank">Home</a></li>
                    <li><a href="#" target="_blank">Features</a></li>
                    <li><a href="#" target="_blank">Booking</a></li>
                    <li><a href="#" target="_blank">Contact</a></li>
                    <li><a href="#" target="_blank">About</a></li>
                    <li><a href="#" target="_blank" id="login">Login</a></li>
                </ul>
            </div>
        </div>

        <div class="lines">
            <div class="line1"></div><br>
            <div class="line2"></div><br>
            <div class="line3"></div><br>
        </div>

        <div class="container">
            <div class="text animate__animated animate__jackInTheBox">
                <h1>Future <br> On Your Wrist</h1>
            </div>
            <div class="image animate__animated animate__lightSpeedInLeft animate__delay-1s">
                <img src="WatchImage.png" alt="Watch Image" width="400">
            </div>
        </div>
        <button class="animate__animated animate__lightSpeedInLeft animate__delay-2s">Order Now</button>

        <div class="socialIcons animate__animated animate__lightSpeedInLeft animate__delay-3s">
            <img id="fb" src="Facebook (2).png" alt="Facebook" width="50">
            <img id="insta" src="Instagram.png" alt="Instagram" width="50">
            <img id="whatsapp" src="Whatsapp.png" alt="Whatsapp" width="50">
            <img id="twit" src="Twitter (2).png" alt="Twitter" width="50">
        </div>

    </header>

</body>

</html>
